[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gisel"
dynamic = ["version"]
description = "A free-form language for GlobalISel legalizer rules"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
gisel = "gisel.cli:main"

[tool.setuptools.dynamic]
version = {attr = "gisel.__version__"}

[tool.setuptools.packages.find]
include = ["gisel*"]

[tool.setuptools.package-data]
gisel = [
    "data/*.json",
    "data/*.jsonc",
    # `--corpus NAME` has to work from an installed wheel, where tests/ does
    # not exist.  These are byte-identical copies of tests/corpus and
    # tests/cases; tools/sync-package-data.py refreshes them and CI fails on
    # drift, so the wheel cannot ship a corpus the checkout disagrees with.
    "data/corpus/*.gisel",
    "data/cases/*.json",
    "data/artifacts/*.inc",
]
