[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gisel"
version = "0.1.0"
description = "A free-form language for GlobalISel legalizer rules"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
gisel = "gisel.cli:main"

[tool.setuptools.packages.find]
include = ["gisel*"]
