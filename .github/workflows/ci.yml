name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: static checks
        run: |
          python3 -m gisel.cli lint tests/corpus/X86LegalizerInfo.gisel
          python3 -m gisel.cli lint tests/corpus/AArch64LegalizerInfo.gisel
          python3 -m gisel.cli lint tests/corpus/RISCVLegalizerInfo.gisel
      - name: unit tests
        run: python3 -m unittest discover -v -s tests
      - name: every backend without llvm-tblgen
        run: |
          set -eu
          shim=$(mktemp -d)
          printf '#!/bin/sh\necho "llvm-tblgen is not part of this toolchain" >&2\nexit 1\n' > "$shim/llvm-tblgen"
          chmod +x "$shim/llvm-tblgen"
          export PATH="$shim:$PATH"
          out=$(mktemp -d)
          for target in X86 AArch64 RISCV; do
            for emit in inc check core; do
              python3 -m gisel.cli gen "tests/corpus/${target}LegalizerInfo.gisel" \
                --emit="$emit" --out "$out/$target.$emit"
            done
          done
          test -s "$out/AArch64.core" -a -s "$out/X86.core" \
            -a -s "$out/RISCV.core"
      - name: clean install, outside the checkout
        run: |
          set -eu
          python3 -m venv /tmp/gisel-venv
          /tmp/gisel-venv/bin/pip install -q .
          work=$(mktemp -d)
          cp tests/corpus/AArch64LegalizerInfo.gisel "$work/"
          cd "$work"
          /tmp/gisel-venv/bin/gisel --version
          /tmp/gisel-venv/bin/gisel lint AArch64LegalizerInfo.gisel
          /tmp/gisel-venv/bin/gisel gen AArch64LegalizerInfo.gisel \
            --emit=inc --out a.inc
          cmp a.inc "$GITHUB_WORKSPACE/tests/artifacts/aarch64.inc"
          /tmp/gisel-venv/bin/gisel gen AArch64LegalizerInfo.gisel \
            --emit=core --out a.core.json
          /tmp/gisel-venv/bin/gisel eval --doc a.core.json \
            --features "$GITHUB_WORKSPACE/tests/cases/features.json" \
            --cases "$GITHUB_WORKSPACE/tests/cases/a64_ref_dump.jsonl"
      - name: installed product surface
        run: |
          set -eu
          # spec/cli.md: seven verbs, one version, one exit-code vocabulary.
          for command in gen check cases domain lint eval graph; do
            /tmp/gisel-venv/bin/gisel "$command" --help > /dev/null
          done
          /tmp/gisel-venv/bin/gisel --version | grep -qx \
            "gisel $(/tmp/gisel-venv/bin/python -c 'import gisel; print(gisel.__version__)')"
          if /tmp/gisel-venv/bin/gisel diff a b 2> /dev/null; then
            echo "diff is a workbench verb and must not be a gisel command" >&2
            exit 1
          fi
          # Run outside the checkout: at the repo root, `gisel.egg-info` wins
          # the metadata lookup and the check would inspect the build tree
          # instead of the installed wheel.
          cd "$RUNNER_TEMP"
          /tmp/gisel-venv/bin/python - <<'PY'
          import importlib.metadata as md

          dist = md.distribution("gisel")
          root = dist.locate_file("")
          assert "site-packages" in str(root), root
          files = [str(f) for f in dist.files]
          leaked = [f for f in files if f.startswith(("tools/", "tests/", "docs/"))]
          assert not leaked, leaked
          assert any(f.endswith("data/opcode-slots.json") for f in files), files
          assert any(f.endswith("licenses/LICENSE") for f in files), files
          meta = md.metadata("gisel")
          assert meta["License-Expression"] == "Apache-2.0 WITH LLVM-exception", meta
          print("%d files, no workbench paths" % len(files))
          PY
