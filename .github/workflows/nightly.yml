name: nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  expensive-graphs:
    # AArch64 baseline is 1.1M states and ~8 minutes on its own; the four
    # X86 configs and the six other corpora are cheap next to it.  The
    # manifest pins the bytes.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: expensive graph configurations
        run: bash tools/check-nightly-graphs.sh
      - name: all nine case files are byte-identical
        run: bash tools/check-cases-golden.sh
      - name: collect diagnostics on failure
        if: failure()
        run: python3 -m gisel doctor --json > "$RUNNER_TEMP/gisel-doctor.json" || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nightly-diagnostics
          path: ${{ runner.temp }}/gisel-doctor.json
