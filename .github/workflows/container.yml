name: container

# The image is a second supported way to run the three tools with no Python on
# the host: `docker run --rm ghcr.io/nodecoda/gisel gisel demo`.
#
# Only the files the image actually contains can change its bytes, so a docs
# push does not rebuild it.  Release tags do not need their own trigger: a
# `v*` tag always names a commit whose main push ran this workflow, and the
# tag is read from `gisel/__init__.py`, so tagging `v0.3.2` is what makes the
# `:0.3.2` tag exist.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - gisel/**
      - pyproject.toml
      - README.md
      - LICENSE
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: the tag is the package version, not the branch
        id: version
        run: |
          set -eu
          version=$(python3 -c 'import gisel; print(gisel.__version__)')
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image name
        id: image
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          printf 'name=ghcr.io/%s/gisel\n' "$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test the image that was pushed
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
        run: |
          set -eu
          docker run --rm "$IMAGE" gisel --version
          docker run --rm "$IMAGE" gisel demo --corpus m68k --out /tmp/demo \
            | grep -q '^demo: ok'
          docker run --rm "$IMAGE" gisel-ab suite check --target m68k
